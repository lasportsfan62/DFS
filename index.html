<!DOCTYPE html>
<html>

<head>
    <title>Fantasy Futbol</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: "Times New Roman", Times, serif;
            max-width: 900px;
            margin: auto;
            padding: 18px;
            background: #f7f7f7;
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        .hero-image {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
        }

        .status-line {
            font-size: 20px;
            text-align: center;
            margin-bottom: 18px;
            color: #333;
        }

        .results {
            background: white;
            border: 2px solid black;
            border-radius: 12px;
            box-shadow: 2px 2px 0px #000;
            margin: 0 auto 18px auto;
            overflow: hidden;
            width: 50%;
            min-width: 320px;
        }

        .results-header {
            color: white;
            padding: 10px 14px;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
        }

        .game {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            font-size: 18px;
            border-bottom: 1px solid #e5e5e5;
        }

        .game:last-child {
            border-bottom: none;
        }

        .team {
            flex: 1;
            font-size: 20px;
            font-weight: 500;
        }

        .team.right {
            text-align: right;
        }

        .score {
            font-weight: bold;
            padding: 0 12px;
            white-space: nowrap;
            font-size: 18px;
        }

        .nav-buttons {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 20px;
            border-radius: 12px;
            text-decoration: none;
            color: black;
            background: white;
            border: 2px solid black;
            box-shadow: 2px 2px 0px #000;
            font-size: 20px;
            font-weight: bold;
            transition: all 0.15s ease-in-out;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 6px 6px 0px #000;
        }

        .left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .icon {
            font-size: 26px;
        }

        .home { background: #e8f4ff; }
        .friend { background: #fff3e6; }
        .foundation { background: #eaffea; }

        @media (max-width: 768px) {
            .results {
                width: 95%;
            }
        }
    </style>
</head>

<body>

    <img
        src="https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExM2lib3hsNjBvdG41Nms4d2Zhb2tndDlhejlqamR6YzMwa2NlaG9zMiZlcD12MV9pbnRlcm5hbF9naWZfaWQmY3Q9Zw/gLWTWCg96RA0btDUm0/giphy.gif"
        alt="Fantasy Futbol"
        class="hero-image">

    <h1>Fantasy Fútbol</h1>

    <div class="status-line" id="statusLine"></div>

    <!-- TODAY'S GAMES -->
    <div class="results">
        <div class="results-header">⚽ Today’s Games</div>

        <div class="game">
            <div class="team">Qatar</div>
            <div class="score">1 - 1</div>
            <div class="team right">Switzerland</div>
        </div>
        
        <div class="game">
            <div class="team">Brazil</div>
            <div class="score">1 - 1</div>
            <div class="team right">Morocco</div>
        </div>

        <div class="game">
            <div class="team">Haiti</div>
            <div class="score">0 - 1</div>
            <div class="team right">Scotland 🏅</div>
        </div>

        <div class="game">
            <div class="team">Australia 🏅</div>
            <div class="score">2 - 0</div>
            <div class="team right">Turkiye</div>
        </div>
    </div>

    <!-- YESTERDAY'S RESULTS (NEW IDENTICAL BOX) -->
    <div class="results">
        <div class="results-header">⚽ Yesterday’s Results</div>

        <div class="game">
            <div class="team">Canada</div>
            <div class="score">1 - 1</div>
            <div class="team right">B&H</div>
        </div>

        <div class="game">
            <div class="team">USA 🏅</div>
            <div class="score">4 - 1</div>
            <div class="team right">Paraguay</div>
        </div>
    </div>

    <!-- NAV CARDS -->
    <div class="nav-buttons">

        <a href="Home.html" class="card home">
            <div class="left">
                <span class="icon">🏠</span>
                Home League Standings
            </div>
            <span>→</span>
        </a>

        <a href="Friend.html" class="card friend">
            <div class="left">
                <span class="icon">👥</span>
                Friend League Standings
            </div>
            <span>→</span>
        </a>

        <a href="Foundation.html" class="card foundation">
            <div class="left">
                <span class="icon">📊</span>
                Foints Per Team
            </div>
            <span>→</span>
        </a>

    </div>

<p></p>

<a href="https://soccer2026.app/bracket" target="_blank" title="World Cup 2026 Bracket"><img src="https://soccer2026.app/images/bracket/world-cup-2026-bracket-en.png" alt="World Cup 2026 Bracket" style="max-width:100%;height:auto;" /></a><p style="font-size:12px;color:#888;text-align:center;"></p>

</div>
           <p></p>
<a href="https://soccer2026.app/schedule" target="_blank" title="World Cup 2026 Schedule - All 104 Matches"><img src="https://soccer2026.app/images/og/world-cup-2026-full-schedule.png" alt="World Cup 2026 Schedule - All 104 matches with dates, kickoff times and venues" style="max-width:100%;height:auto;" /></a><p style="font-size:12px;color:#888;text-align:center;"></p>
    <script>
        function formatDate(date) {
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            return date.toLocaleDateString(undefined, options);
        }

        document.getElementById("statusLine").textContent =
            `Last Updated: ${formatDate(new Date())} | Through Game 4/104`;

        const colors = [
            "#111111",
            "#1f4e79",
            "#2e7d32",
            "#8e24aa",
            "#c62828",
            "#F22CE5",
            "#EFBF04",
            "#C0C0C0",
            "#ef6c00"
        ];

        const randomColor = colors[Math.floor(Math.random() * colors.length)];
        const headers = document.querySelectorAll(".results-header");
headers.forEach(h => {
    h.style.backgroundColor = randomColor;
});
    </script>

</body>

</html>
