<!DOCTYPE html>
<html>

<head>
    <title>Home League Standings</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: "Times New Roman", Times, serif;
            max-width: 900px;
            margin: auto;
            padding: 18px;
            background: #f7f7f7;
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        .sheet-container {
            width: 100%;
            overflow-x: auto;
        }

        .sheet {
            width: 100%;
            border: none;
        }

        /* NAV CONTAINER */
        .nav-buttons {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* CARD BUTTONS */
        .card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 20px;
            border-radius: 12px;
            text-decoration: none;
            color: black;
            background: white;
            border: 2px solid black;
            box-shadow: 2px 2px 0px #000;
            font-size: 20px;
            font-weight: bold;
            transition: all 0.15s ease-in-out;
            width: 100%;
            box-sizing: border-box;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 6px 6px 0px #000;
        }

        .left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .icon {
            font-size: 26px;
        }

        .home { background: #ffa4a4; }
        .friend { background: #fff3e6; }
        .foundation { background: #eaffea; }

        /* =========================
           MOBILE FIX: equal width buttons
           ========================= */
        @media (max-width: 768px) {

            .nav-buttons {
                align-items: center;
            }

            .card {
                width: 92%;
                max-width: 340px;
                margin: 0 auto;
            }

            .card .left {
                flex: 1;
            }

            .card span:last-child {
                flex-shrink: 0;
            }

            .results {
                width: 95%;
            }
        }
    </style>
</head>

<body>

    <!-- NAV CARDS -->
    <div class="nav-buttons">

        <a href="index.html" class="card home">
            <div class="left">
                <span class="icon">🏆</span>
                Main Page
            </div>
            <span>→</span>
        </a>

        <a href="Friend.html" class="card friend">
            <div class="left">
                <span class="icon">👥</span>
                Friend League Standings
            </div>
            <span>→</span>
        </a>

        <a href="Foundation.html" class="card foundation">
            <div class="left">
                <span class="icon">📊</span>
                Foints Per Team
            </div>
            <span>→</span>
        </a>

    </div>

    <h1>Home League Standings</h1>

    <div class="sheet-container">
        <iframe class="sheet"
            src="https://docs.google.com/spreadsheets/d/e/2PACX-1vS_kMpc8iHhDJvjChvqH0-zd6LOiq_IBU8auxAuoHejs_7CxfQnCXceybmagp8wDmq6nDwEtqCxRhIQ/pubhtml?gid=0&single=true"
            height="2500"></iframe>
    </div>

</body>

</html>
