<!DOCTYPE html>
<html>

<head>
    <title>Fantasy Futbol</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: "Times New Roman", Times, serif;
            max-width: 900px;
            margin: auto;
            padding: 20px;
            background: #fafafa;
        }

        .hero-image {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
            margin-top: 15px;
            margin-bottom: 20px;
        }

        /* CARD CONTAINER */
        .nav-buttons {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 15px;
        }

        /* CARD BUTTON STYLE */
        .card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 22px;
            border-radius: 12px;
            text-decoration: none;
            color: black;
            background: white;
            border: 2px solid #000;
            box-shadow: 2px 2px 0px #000;
            transition: all 0.15s ease-in-out;
            font-size: 22px;
            font-weight: bold;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 6px 6px 0px #000;
        }

        /* COLOR THEMES */
        .home {
            background: #e8f4ff;
        }

        .friend {
            background: #fff3e6;
        }

        .foundation {
            background: #eaffea;
        }

        .icon {
            font-size: 28px;
            margin-right: 12px;
        }

        .left {
            display: flex;
            align-items: center;
        }

        .status-line {
            font-size: 20px;
            margin-top: 10px;
            text-align: center;
            color: #333;
        }

        @media (max-width: 768px) {
            .card {
                font-size: 18px;
                padding: 18px;
            }
        }
    </style>
</head>

<body>

    <img
        src="https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExM2lib3hsNjBvdG41Nms4d2Zhb2tndDlhejlqamR6YzMwa2NlaG9zMiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/gLWTWCg96RA0btDUm0/giphy.gif"
        alt="Fantasy Futbol"
        class="hero-image">

    <h1>Fantasy Fútbol</h1>

    <div class="nav-buttons">

        <a href="home league.html" class="card home">
            <div class="left">
                <span class="icon">🏠</span>
                Home League Standings
            </div>
            <span>→</span>
        </a>

        <a href="friend league.html" class="card friend">
            <div class="left">
                <span class="icon">👥</span>
                Friend League Standings
            </div>
            <span>→</span>
        </a>

        <a href="foundation.html" class="card foundation">
            <div class="left">
                <span class="icon">📊</span>
                Foints Per Team
            </div>
            <span>→</span>
        </a>

    </div>

    <div class="status-line" id="statusLine"></div>

    <script>
        function formatDate(date) {
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            return date.toLocaleDateString(undefined, options);
        }

        const today = new Date();

        document.getElementById("statusLine").textContent =
            `Last Updated: ${formatDate(today)} | Through Game xx/104`;
    </script>

</body>

</html>
