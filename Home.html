<!DOCTYPE html>
<html>

<head>
    <title>Home League Standings</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: "Times New Roman", Times, serif;
            max-width: 1200px;
            margin: auto;
            padding: 15px;
        }

        .nav-buttons {
            margin-bottom: 15px;
        }

        .button {
            font-size: 16px;
            font-weight: 700;
            padding: 12px 22px;
            border-radius: 10px;
            border: 2px solid rgba(0,0,0,0.3);
            text-decoration: none;
            color: white;
            display: inline-block;
            margin-right: 8px;

            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
            transition: all 0.2s ease-in-out;
            position: relative;
        }

        .button:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 10px 18px rgba(0, 0, 0, 0.35);
            filter: brightness(1.1);
        }

        .button:active {
            transform: translateY(0px) scale(0.98);
        }

        .sheet-container {
            width: 100%;
            overflow-x: auto;
        }

        .sheet {
            width: 100%;
            border: none;
        }

        /* =========================
           MOBILE ONLY IMPROVEMENTS
           ========================= */
        @media (max-width: 600px) {

            .nav-buttons {
                display: flex;
                flex-direction: column;
                gap: 10px;
            }

            .button {
                display: block;
                width: 100%;
                text-align: center;
                margin-right: 0;
                padding: 14px 16px;
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

    <div class="nav-buttons">
        <a href="index.html" class="button">Main Page</a>
        <a href="Friend.html" class="button">Friend League</a>
        <a href="Foundation.html" class="button">Foints Per Team</a>
    </div>

    <h1>Home League Standings</h1>

    <div class="sheet-container">
        <iframe class="sheet"
            src="https://docs.google.com/spreadsheets/d/e/2PACX-1vS_kMpc8iHhDJvjChvqH0-zd6LOiq_IBU8auxAuoHejs_7CxfQnCXceybmagp8wDmq6nDwEtqCxRhIQ/pubhtml?gid=0&single=true"
            height="600"></iframe>
    </div>

    <script>
        function randomColor() {
            const hue = Math.floor(Math.random() * 360);
            return `hsl(${hue}, 70%, 55%)`;
        }

        const buttons = document.querySelectorAll(".button");

        buttons.forEach(btn => {
            const color = randomColor();
            btn.style.background = color;
            btn.style.borderColor = "rgba(0,0,0,0.25)";
        });
    </script>

</body>

</html>
