<!DOCTYPE html>
<html>
<head>
    <title>Fantasy Futbol Rules</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: "Times New Roman", Times, serif;
            margin: 0;
            padding: 0;
            background: #f7f7f7;
        }

        .header {
            text-align: center;
            padding: 16px;
            font-size: 24px;
            font-weight: bold;
        }

        .back-container {
            text-align: center;
        }

        .back {
            display: inline-block;
            margin: 10px auto 15px auto;
            padding: 12px 24px;
            background: linear-gradient(135deg, #1e90ff, #0047ab);
            color: white;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        .back:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.3);
            background: linear-gradient(135deg, #339cff, #0056d6);
        }

        .pdf-container {
            width: 100%;
            height: 95vh;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>

    <div class="header">Fantasy Fútbol Rules</div>

    <div class="back-container">
        <a class="back" href="index.html">⚽ Back to Home</a>

    <div class="pdf-container">
        <iframe
            src="https://green-alika-60.tiiny.site">
